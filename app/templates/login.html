<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-bg">
  <main class="login-card">
    <div class="hero-icon">🍽️</div>
    <h1>{{ app_name }}</h1>
    <p>Gestion cuisine assistée par IA</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>PIN cuisine</label>
      <input name="pin" type="password" inputmode="numeric" required autofocus>
      <button class="primary wide">Entrer</button>
    </form>
  </main>
</body>
</html>
