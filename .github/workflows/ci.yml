name: KitchenOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall app seed_demo.py
      - name: Database smoke
        env:
          DATABASE_PATH: /tmp/kitchenops.db
        run: python -c "from app.db import init_db; init_db(); print('db-ok')"
      - name: App import smoke
        env:
          DATABASE_PATH: /tmp/kitchenops-app.db
        run: python -c "import app.main; print('app-import-ok')"
      - name: Template smoke
        run: python -c "from jinja2 import Environment, FileSystemLoader; e=Environment(loader=FileSystemLoader('app/templates')); [e.get_template(x) for x in e.list_templates()]; print('templates-ok')"
      - name: Tests
        run: pytest -q
      - name: Docker build
        run: docker build -t kitchenops-ci .
